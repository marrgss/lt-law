# Deploys the fetch relay (worker/, D-019) when its code changes, or by hand (e.g. after rotating
# RELAY_KEY). The nightly job only uses it. Needs vars.RELAY == 'true' and the secrets
# CLOUDFLARE_RELAY_TOKEN (Cloudflare "lt-law GitHub: deploy relay (Workers)": Workers Scripts Write, Account Settings Read), CLOUDFLARE_ACCOUNT_ID, RELAY_KEY.
name: relay

on:
  push:
    branches: [main]
    paths: ["worker/**", "deploy/package-lock.json", ".github/workflows/relay.yml"]
  workflow_dispatch: {}

permissions: {}

jobs:
  deploy:
    if: ${{ vars.RELAY == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read         # checkout only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            worker
            deploy

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"

      - name: Deploy the relay and set its key
        env:
          # Cloudflare token "lt-law GitHub: deploy relay (Workers)": Workers Scripts Write + Account Settings Read only
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_RELAY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RELAY_KEY: ${{ secrets.RELAY_KEY }}
          GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::secret CLOUDFLARE_RELAY_TOKEN is missing (docs/OPERATIONS.md)"
            exit 1
          fi
          export CLOUDFLARE_API_TOKEN=$(printf %s "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')
          npm ci --prefix deploy --no-audit --no-fund
          W=$PWD/deploy/node_modules/.bin/wrangler
          cd worker
          $W deploy 2>&1 | sed -E 's#https://[a-z0-9.-]+\.workers\.dev#https://<relay>.workers.dev#g'
          printf %s "$RELAY_KEY" | tr -d '[:space:]' | $W secret put RELAY_KEY
          if [ -n "$GH_DISPATCH_TOKEN" ]; then  # optional: the punctual 00:05 start (E1)
            printf %s "$GH_DISPATCH_TOKEN" | tr -d '[:space:]' | $W secret put GH_DISPATCH_TOKEN
          fi
