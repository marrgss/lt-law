[project]
name = "lt-law"
version = "0.1.0"
description = "Open, unofficial, article-level mirror of Lithuanian legislation (TAR open data)"
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
dependencies = [
  "jinja2>=3.1",
  "pyyaml>=6",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ltlaw"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["data: needs data/ snapshots (bin/snapshot_scope.py)"]
